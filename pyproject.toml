[project]
name = "lkio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "astropy>=6.1",
    "lkdata",
    "numpy>=2.2.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "lksearch>=1.2.1",
    "pytest>=8.3.0",
    "ruff>=0.15",
]

[tool.uv.sources]
lkdata = { git = "https://github.com/lightkurve/lkdata" }
lksearch = { git = "https://github.com/lightkurve/lksearch" }
